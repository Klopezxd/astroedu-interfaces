<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="100%" height="100%">
  <rect width="1024" height="640" fill="#070b19" rx="12"/>
  <text x="512" y="35" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">RETÍCULA MAESTRA DE 7 ZONAS (ZONIFICACIÓN DE PANTALLA DE CÁTEDRA)</text>
  
  <!-- CONTENEDOR GRID -->
  <g transform="translate(32, 55)">
    <!-- CABECERA -->
    <!-- Zona 1: Logo -->
    <rect x="0" y="0" width="220" height="70" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
    <text x="110" y="35" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">ZONA 1: LOGOTIPO</text>
    <text x="110" y="52" font-size="10" fill="#94a3b8" text-anchor="middle">220px • AstroEdu / ESPE</text>

    <!-- Zona 2: Título -->
    <rect x="230" y="0" width="460" height="70" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
    <text x="460" y="32" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">ZONA 2: TEMA / TÍTULO DE APLICACIÓN</text>
    <text x="460" y="52" font-size="9" fill="#94a3b8" text-anchor="middle">Astronomía Básica y Observación del Cielo • Klever López (NRC 36733)</text>

    <!-- Zona 3: Banner -->
    <rect x="700" y="0" width="260" height="70" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="6"/>
    <text x="830" y="32" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">ZONA 3: BANNER / EFEMÉRIDES</text>
    <text x="830" y="52" font-size="9" fill="#ffd166" text-anchor="middle">Status del Cielo + Conmutador Afectivo</text>

    <!-- BARRAS DE CONTROL -->
    <!-- Zona 4: Menú Textual -->
    <rect x="0" y="80" width="670" height="40" fill="#111a33" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="335" y="105" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">ZONA 4: MENÚ TEXTUAL (1. Solar | 2. Constelaciones | 3. Luna | 4. Meteoros | 5. Galaxias | 6. Astrofotografía)</text>

    <!-- Zona 5: Menú de Íconos -->
    <rect x="680" y="80" width="280" height="40" fill="#111a33" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="820" y="105" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">ZONA 5: MENÚ DE ÍCONOS + TOOLTIPS</text>

    <!-- CUERPO PRINCIPAL -->
    <!-- Zona 6: Contenido / Trabajo -->
    <rect x="0" y="130" width="670" height="390" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="6"/>
    <text x="335" y="180" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">ZONA 6: ÁREA DE DESPLIEGUE DE CONTENIDOS Y TRABAJO</text>
    <text x="335" y="210" font-size="11" fill="#94a3b8" text-anchor="middle">Superficie dinámica para interacción multimedia: Liencillo Canvas 2D,</text>
    <text x="335" y="230" font-size="11" fill="#94a3b8" text-anchor="middle">simuladores orbitales, cartas celestes interactivas, galería con zoom</text>
    <text x="335" y="250" font-size="11" fill="#94a3b8" text-anchor="middle">y visor HUD de cámara profesional móvil.</text>
    <rect x="50" y="290" width="570" height="190" fill="#030611" stroke="rgba(56,189,248,0.3)" rx="4"/>
    <text x="335" y="390" font-size="12" fill="#38bdf8" text-anchor="middle">[ Viewport Canvas Activo: width: 100%, height: 420px ]</text>

    <!-- Zona 7: Navegación e Interactividad -->
    <rect x="680" y="130" width="280" height="390" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="6"/>
    <text x="820" y="165" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">ZONA 7: ÁREA DE</text>
    <text x="820" y="185" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">INTERACTIVIDAD</text>
    
    <rect x="700" y="210" width="240" height="75" fill="#1e293b" stroke="#f59e0b" rx="4"/>
    <text x="820" y="235" font-size="10" font-weight="bold" fill="#ffd166" text-anchor="middle">⚙️ Controles Contextuales</text>
    <text x="820" y="255" font-size="9" fill="#94a3b8" text-anchor="middle">Botones de animación y filtros</text>

    <rect x="700" y="295" width="240" height="100" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="820" y="320" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">🎯 Mini-Quiz Cognitivo</text>
    <text x="820" y="340" font-size="9" fill="#94a3b8" text-anchor="middle">Evaluación formativa inmediata</text>

    <rect x="700" y="405" width="240" height="95" fill="#1e293b" stroke="#ef4444" rx="4"/>
    <text x="820" y="430" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">🧠 Monitor Afectivo</text>
    <text x="820" y="450" font-size="9" fill="#94a3b8" text-anchor="middle">Confort visual y carga cognitiva</text>

    <!-- PIE -->
    <rect x="0" y="530" width="960" height="30" fill="#0b1124" stroke="rgba(255,255,255,0.1)" rx="4"/>
    <text x="480" y="550" font-size="10" fill="#64748b" text-anchor="middle">Pie de Página: ESPE - DCC - NRC 36733 - Klever Josué López Quilligana</text>
  </g>
</svg>
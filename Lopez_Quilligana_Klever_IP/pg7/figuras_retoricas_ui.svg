<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#070b19" rx="12"/>
  <text x="450" y="40" font-family="'Outfit', sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">FIGURAS RETÓRICAS APLICADAS AL DISEÑO DE INTERFACES (UI)</text>
  <text x="450" y="65" font-family="'Outfit', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Semiótica Visual y Comunicación Gráfica en AstroEdu</text>
  
  <!-- 1. Metáfora -->
  <g transform="translate(40, 95)">
    <rect width="390" height="170" fill="#111a33" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#38bdf8">1. Metáfora Visual: El Telescopio y el Visor</text>
    <circle cx="65" cy="95" r="40" fill="#040714" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="65" cy="95" r="3" fill="#f59e0b"/>
    <line x1="25" y1="95" x2="105" y2="95" stroke="#38bdf8" stroke-dasharray="2 2"/>
    <line x1="65" y1="55" x2="65" y2="135" stroke="#38bdf8" stroke-dasharray="2 2"/>
    
    <text x="120" y="70" font-size="11" font-weight="bold" fill="#f8fafc">Concepto Mundo Real → Software:</text>
    <text x="120" y="90" font-size="10" fill="#94a3b8">La pantalla actúa como la lente ocular de un</text>
    <text x="120" y="105" font-size="10" fill="#94a3b8">telescopio astronómico, con cruceta de</text>
    <text x="120" y="120" font-size="10" fill="#94a3b8">apuntado y visor HUD de parámetros ISO/EXP.</text>
    <text x="120" y="145" font-size="10" fill="#f59e0b">Reduce la carga cognitiva por familiaridad.</text>
  </g>

  <!-- 2. Metonimia -->
  <g transform="translate(470, 95)">
    <rect width="390" height="170" fill="#111a33" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#f59e0b">2. Metonimia: La Parte por el Todo (Anillos)</text>
    <ellipse cx="65" cy="95" rx="42" ry="14" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="65" cy="95" r="22" fill="#d97706"/>
    
    <text x="120" y="70" font-size="11" font-weight="bold" fill="#f8fafc">Representación Semántica:</text>
    <text x="120" y="90" font-size="10" fill="#94a3b8">El ícono de Saturno con sus anillos representa</text>
    <text x="120" y="105" font-size="10" fill="#94a3b8">a TODO el módulo de "Sistema Solar y</text>
    <text x="120" y="120" font-size="10" fill="#94a3b8">Planetas", asociando el rasgo más icónico.</text>
    <text x="120" y="145" font-size="10" fill="#38bdf8">Reconocimiento inmediato en milisegundos.</text>
  </g>

  <!-- 3. Hipérbole -->
  <g transform="translate(40, 290)">
    <rect width="390" height="170" fill="#111a33" stroke="#818cf8" stroke-width="1.5" rx="8"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#818cf8">3. Hipérbole: Magnificación Cósmica</text>
    <circle cx="65" cy="95" r="45" fill="url(#sunGrad)"/>
    <circle cx="65" cy="95" r="5" fill="#38bdf8"/>
    
    <text x="120" y="70" font-size="11" font-weight="bold" fill="#f8fafc">Exageración Didáctica:</text>
    <text x="120" y="90" font-size="10" fill="#94a3b8">En el lienzo solar se amplía deliberadamente el</text>
    <text x="120" y="105" font-size="10" fill="#94a3b8">tamaño relativo de los planetas y el Sol frente</text>
    <text x="120" y="120" font-size="10" fill="#94a3b8">a sus distancias para hacerlos visibles y legibles.</text>
    <text x="120" y="145" font-size="10" fill="#818cf8">Prioriza la pedagogía sobre la escala 1:1.</text>
  </g>

  <!-- 4. Elipsis -->
  <g transform="translate(470, 290)">
    <rect width="390" height="170" fill="#111a33" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#10b981">4. Elipsis: Supresión de Elementos Superfluos</text>
    <circle cx="45" cy="95" r="14" fill="#1e293b"/>
    <circle cx="85" cy="95" r="14" fill="#38bdf8"/>
    <circle cx="125" cy="95" r="14" fill="#ffffff"/>
    
    <text x="160" y="70" font-size="11" font-weight="bold" fill="#f8fafc">Síntesis Gráfica Minimalista:</text>
    <text x="160" y="90" font-size="10" fill="#94a3b8">En el simulador lunar se omite el fondo complejo</text>
    <text x="160" y="105" font-size="10" fill="#94a3b8">para centrar la atención humana 100% en el</text>
    <text x="160" y="120" font-size="10" fill="#94a3b8">terminador solar y el porcentaje de luz.</text>
    <text x="160" y="145" font-size="10" fill="#10b981">Cumple la Heurística #8 de Jakob Nielsen.</text>
  </g>
</svg>